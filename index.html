<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chem Lab: Water Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui">
        <header class="top-bar">
          <div class="brand">Chem Lab</div>
          <div class="stats">
            <span id="score">Score: 0</span>
            <span id="molecules">H₂O: 0</span>
            <span id="quality">Quality: Auto</span>
          </div>
        </header>
        <aside class="side-panel">
          <section>
            <h2>Selected Atom</h2>
            <p id="selected-atom">None</p>
            <p id="valence-status">Valence: —</p>
            <p id="bonding-tip">Tip: Drag atoms close to bond slots.</p>
          </section>
          <section>
            <h2>Quest</h2>
            <p id="quest-title">Form 1 water molecule</p>
            <div class="progress">
              <div id="quest-progress"></div>
            </div>
          </section>
          <section class="controls">
            <h2>Controls</h2>
            <button id="reset">Reset Scene</button>
            <button id="spawn-h">Spawn H</button>
            <button id="spawn-o">Spawn O</button>
            <div class="quality">
              <label>Quality</label>
              <select id="quality-select">
                <option>Auto</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
          </section>
        </aside>
        <div class="toast" id="education-toast"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
